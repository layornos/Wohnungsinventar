<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#ffffff" />
		<script>
			// Design vor dem ersten Rendern setzen, damit nicht kurz das falsche aufblitzt (siehe lib/design.svelte.ts).
			// Die Farben müssen zu --themenfarbe in app.css passen.
			(function () {
				var design = 'minimal';
				try {
					var gespeichert = localStorage.getItem('inventar.design');
					if (gespeichert === 'neon' || gespeichert === 'weich') design = gespeichert;
				} catch (e) {}
				document.documentElement.dataset.design = design;
				var dunkel = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
				var farbe = design === 'neon' ? '#09090f' : design === 'weich' ? '#f3f0fa' : dunkel ? '#09090b' : '#ffffff';
				document.querySelector('meta[name="theme-color"]').setAttribute('content', farbe);
			})();
		</script>
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		<meta name="apple-mobile-web-app-title" content="Inventar" />
		<title>Inventar</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
