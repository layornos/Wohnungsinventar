<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#ffffff" />
		<script>
			// Set the theme before the first render so the wrong one doesn't flash briefly (see lib/theme.svelte.ts).
			// The colours must match --theme-color in app.css.
			(function () {
				var theme = 'minimal';
				try {
					var stored = localStorage.getItem('inventar.theme');
					if (stored === null) {
						// Take over the value stored under the old key once.
						var old = localStorage.getItem('inventar.design');
						if (old !== null) {
							stored = old === 'weich' ? 'soft' : old;
							localStorage.setItem('inventar.theme', stored);
							localStorage.removeItem('inventar.design');
						}
					}
					if (stored === 'neon' || stored === 'soft') theme = stored;
				} catch (e) {}
				document.documentElement.dataset.theme = theme;
				var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
				var color = theme === 'neon' ? '#09090f' : theme === 'soft' ? '#f3f0fa' : dark ? '#09090b' : '#ffffff';
				document.querySelector('meta[name="theme-color"]').setAttribute('content', color);
			})();
		</script>
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		<meta name="apple-mobile-web-app-title" content="Inventar" />
		<title>Inventar</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
